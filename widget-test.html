<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Widget load test — temporary</title>
<style>
  body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#f4f1ef;color:#171314;padding:1rem}
  h1{font-size:1.15rem;margin:0 0 .35rem}
  p{margin:0 0 1rem;color:#5b5153;font-size:.9rem}
  .case{margin:0 0 1.4rem;background:#fff;border:1px solid #ddd6d3;border-radius:6px;overflow:hidden}
  .case h2{margin:0;padding:.55rem .8rem;font-size:.8rem;font-family:ui-monospace,Menlo,monospace;
    letter-spacing:.05em;text-transform:uppercase;color:#8F4552;border-bottom:1px solid #eee;background:#faf8f7}
  .case .hint{padding:.5rem .8rem;font-size:.82rem;color:#5b5153;border-bottom:1px solid #f0ebe9}
  button{appearance:none;border:0;background:#D26E8A;color:#fff;font:600 .9rem system-ui;
    padding:.7rem 1.1rem;margin:.7rem .8rem;border-radius:4px;cursor:pointer}
  .stage{height:420px;overflow:hidden}
  .stage iframe{border:0;width:100%;height:420px;display:block;background:#fff}
  .hidden{display:none}
</style>
</head>
<body>
<h1>Which of these shows the service list?</h1>
<p>Each box loads the same widget a different way. Tap <b>Open</b> in each, then say which ones
show the <b>list of services</b> and which show only a <b>Book Now</b> button.</p>

<div id="cases"></div>

<script>
/* Temporary diagnostic page. Not linked from the site; delete before merging.

   The width theory is dead: a 390px frame renders the full list on her phone.
   So the difference must be in HOW the booking modal loads its frame. The
   modal sets src while its container is still display:none, which may leave
   Vagaro measuring a zero-size window and committing to the button layout.
   These four cases separate that from the alternatives. */
var CASES = [
  { key: "A",
    label: "A — plain frame, always visible",
    hint: "Control. This is the one that already worked for you.",
    run: function(stage, url){ frame(stage, url); } },

  { key: "B",
    label: "B — src set while hidden, then shown",
    hint: "Exactly what the booking window does today.",
    run: function(stage, url){
      stage.classList.add('hidden');
      var f = frame(stage, url);            // src set while the stage is display:none
      stage.classList.remove('hidden');
      return f;
    } },

  { key: "C",
    label: "C — shown first, then src set",
    hint: "Same as B but the frame is visible before it starts loading.",
    run: function(stage, url){
      stage.classList.remove('hidden');
      var f = document.createElement('iframe');
      stage.appendChild(f);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ f.src = url; });
      });
      return f;
    } },

  { key: "D",
    label: "D — shown first, and no referrer policy",
    hint: "Like C, without the referrer setting the booking window uses.",
    run: function(stage, url){
      stage.classList.remove('hidden');
      var f = document.createElement('iframe');
      f.referrerPolicy = "no-referrer-when-downgrade";
      stage.appendChild(f);
      requestAnimationFrame(function(){ f.src = url; });
      return f;
    } }
];

function frame(stage, url){
  var f = document.createElement('iframe');
  f.src = url;
  stage.appendChild(f);
  return f;
}

fetch('content/vagaro.json')
  .then(function(r){ return r.json(); })
  .then(function(cfg){
    var url = (cfg.widgets && (cfg.widgets.promos || cfg.widgets.all)) || '';
    if (!url) { document.getElementById('cases').textContent = 'No widget URL found.'; return; }
    var host = document.getElementById('cases');
    CASES.forEach(function(c){
      var box = document.createElement('div');
      box.className = 'case';
      box.innerHTML = '<h2>' + c.label + '</h2><div class="hint">' + c.hint + '</div>';
      var btn = document.createElement('button');
      btn.textContent = 'Open ' + c.key;
      var stage = document.createElement('div');
      stage.className = 'stage';
      btn.addEventListener('click', function(){
        btn.disabled = true;
        btn.textContent = 'loading…';
        c.run(stage, url);
      });
      box.appendChild(btn);
      box.appendChild(stage);
      host.appendChild(box);
    });
  })
  .catch(function(){ document.getElementById('cases').textContent = 'Could not load the widget list.'; });
</script>
</body>
</html>
