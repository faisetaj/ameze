[build]
  publish = "."
  functions = "netlify/functions"

# Pretty URLs for the portal pages
[[redirects]]
  from = "/updates"
  to = "/updates.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Specials are edited from /admin and must never be served stale
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
