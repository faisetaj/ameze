name: Claude site updates

# issue_comment ONLY. An `issues: [opened]` trigger fires the agent on every raw client
# submission, which defeats gate 1 — the whole point is that a human approves (and can
# rewrite) the instruction before any tokens are spent.
on:
  issue_comment:
    types: [created]

jobs:
  claude:
    # Run on new site-update issues, or whenever @claude is mentioned in a comment
    if: >
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 25"
